<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0b1120"/>
  <!-- watch band lugs -->
  <rect x="26" y="2" width="12" height="12" rx="3" fill="#334155"/>
  <rect x="26" y="50" width="12" height="12" rx="3" fill="#334155"/>
  <!-- bezel -->
  <circle cx="32" cy="32" r="22" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- face -->
  <circle cx="32" cy="32" r="18" fill="#0f1623"/>
  <!-- activity ring -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#34d399" stroke-width="3"
          stroke-linecap="round" stroke-dasharray="84 114" transform="rotate(-90 32 32)"/>
  <!-- clock hands -->
  <line x1="32" y1="32" x2="32" y2="21" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="40.5" y2="36" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="2.6" fill="#34d399"/>
</svg>
